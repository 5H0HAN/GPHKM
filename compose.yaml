services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gphkm
      POSTGRES_USER: gphkm_migration
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD in .env}
      GPHKM_DATABASE_PASSWORD: ${GPHKM_DATABASE_PASSWORD:?Set GPHKM_DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - gphkm_postgres:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/01-runtime-role.sh:/docker-entrypoint-initdb.d/01-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gphkm_migration -d gphkm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gphkm_postgres:
